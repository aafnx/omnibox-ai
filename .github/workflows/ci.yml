name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (Go tests, services, build)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go vet, tests and build
        shell: bash
        run: |
          go vet ./...
          go test ./...
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/omnibox.exe" ./cmd/omnibox
      - name: PowerShell scripts parse in Windows PowerShell 5.1
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          foreach ($script in @('install.ps1', 'scripts\remove-old-version.ps1')) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile("$pwd\$script", [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count) { $errors | ForEach-Object { Write-Host "${script}: $_" }; exit 1 }
          }

  linux:
    name: Linux (Go tests, both builds, web UI)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go format, vet, tests and builds for Windows and Linux
        if: ${{ !cancelled() }}
        run: |
          unformatted="$(gofmt -l .)"; if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
          go vet ./...
          GOOS=windows go vet ./...
          go test -race ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o "$RUNNER_TEMP/omnibox" ./cmd/omnibox
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o "$RUNNER_TEMP/omnibox.exe" ./cmd/omnibox
      - name: Web UI tests
        if: ${{ !cancelled() }}
        run: node tests/web_test.cjs
      - name: install.sh syntax
        if: ${{ !cancelled() }}
        run: sh -n install.sh
