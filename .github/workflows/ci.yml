name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (tests + real SCM)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          # Release commits from releases.json are checked and installed in tests.
          fetch-depth: 0
      - name: PowerShell version
        run: $PSVersionTable.PSVersion.ToString(); if ($PSVersionTable.PSVersion -lt [version]'7.4') { throw 'PowerShell 7.4+ required' }
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go tests
        if: ${{ !cancelled() }}
        run: |
          go vet ./...
          go test ./...
          go build -o "$env:RUNNER_TEMP/omnibox.exe" ./cmd/omnibox
      - name: Core tests
        if: ${{ !cancelled() }}
        run: ./tests/test.ps1
      - name: Update tests
        if: ${{ !cancelled() }}
        run: ./tests/update_test.ps1
      - name: Installer flow tests
        if: ${{ !cancelled() }}
        run: ./tests/install_flow_test.ps1
      - name: Native host tests (real SCM probe)
        if: ${{ !cancelled() }}
        run: ./tests/native_host_test.ps1
      - name: Real SCM tests
        if: ${{ !cancelled() }}
        run: ./tests/scm_test.ps1
      - name: Real installation, forced failure and rollback
        if: ${{ !cancelled() }}
        env:
          OMNIBOX_AI_REAL_INSTALL_TEST: '1'
        run: ./tests/real_install_test.ps1
      - name: HTTP integration tests
        if: ${{ !cancelled() }}
        run: python tests/http_test.py
      - name: Web UI tests
        if: ${{ !cancelled() }}
        run: node tests/web_test.cjs
      - name: dist/ is built from current sources
        if: ${{ !cancelled() }}
        run: |
          ./scripts/build-setup.ps1 -OutputPath "$env:RUNNER_TEMP/install-omnibox-ai.ps1"
          & "$env:RUNNER_TEMP/install-omnibox-ai.ps1" -CheckOnly

  linux:
    name: Linux (cross-platform tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          # Release commits from releases.json are checked and installed in tests.
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go format, vet, tests and builds for Windows and Linux
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"; if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
          go vet ./...
          GOOS=windows go vet ./...
          go test ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o "$RUNNER_TEMP/omnibox" ./cmd/omnibox
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o "$RUNNER_TEMP/omnibox.exe" ./cmd/omnibox
      - name: Core tests
        if: ${{ !cancelled() }}
        run: ./tests/test.ps1
      - name: Update tests
        if: ${{ !cancelled() }}
        run: ./tests/update_test.ps1
      - name: Installer flow tests
        if: ${{ !cancelled() }}
        run: ./tests/install_flow_test.ps1
      - name: Native host tests
        if: ${{ !cancelled() }}
        run: ./tests/native_host_test.ps1
      - name: HTTP integration tests
        if: ${{ !cancelled() }}
        run: python3 tests/http_test.py
      - name: Web UI tests
        if: ${{ !cancelled() }}
        run: node tests/web_test.cjs
